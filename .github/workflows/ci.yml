name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-backend:
    name: Validate Flask (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/flask/requirements.txt ]; then pip install -r backend/flask/requirements.txt; fi
      - name: Syntax check (compile)
        run: python -m compileall backend/flask

  java-backend:
    name: Build Spring Boot (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        run: mvn -B -f backend/springboot -DskipTests package

  frontend-check:
    name: Frontend sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure index exists
        run: |
          if [ ! -f frontend/index.html ]; then echo "frontend/index.html missing"; exit 1; fi
      - name: Basic HTML check
        run: grep -i "<!doctype html" frontend/index.html || (echo "index.html not valid HTML" && exit 1)
